<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs>
 <marker id="black" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker>
 <marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
 <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176da3"/></marker>
 <style>
  text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:28px;font-weight:bold}.t{font-size:23px;font-weight:bold}.s{font-size:19px}
  .axis{stroke:#17212b;stroke-width:3;fill:none;marker-end:url(#black)}.force{stroke:#c0392b;stroke-width:4;fill:none;marker-end:url(#red)}
  .mom{stroke:#176da3;stroke-width:4;fill:none;marker-end:url(#blue)}.beam{stroke:#606a72;stroke-width:7}.dash{stroke:#9099a0;stroke-width:2;stroke-dasharray:7 6;fill:none}
  .panel{fill:#fbfcfd;stroke:#abb5bc;stroke-width:2}.point{fill:#d94a3d;stroke:#7d211b;stroke-width:2}.dot{fill:#17212b}.sign{font-size:25px;font-weight:bold}
 </style>
</defs>
<rect width="1500" height="1000" fill="white"/>
<text x="40" y="42" class="h">Приращения с Rz и направлениями осей</text>
<text x="40" y="74" class="s">Красные стрелки — силы; чёрные — положительные оси; синяя дуга — приращение момента.</text>

<!-- 1 original -->
<rect x="35" y="110" width="430" height="800" rx="12" class="panel"/>
<text x="60" y="150" class="h">Исходное положение</text>
<text x="60" y="182" class="s">Точки A и B видны на оси X</text>
<circle cx="220" cy="470" r="9" class="point"/><text x="200" y="515" class="t">A</text>
<line x1="220" y1="470" x2="390" y2="470" class="axis"/><text x="395" y="478" class="t">+X</text>
<line x1="220" y1="470" x2="105" y2="385" class="axis"/><text x="72" y="378" class="t">+Y</text>
<line x1="220" y1="470" x2="220" y2="270" class="axis"/><text x="205" y="252" class="t">+Z</text>
<line x1="220" y1="470" x2="365" y2="365" class="beam"/>
<circle cx="365" cy="365" r="8" class="dot"/><text x="378" y="360" class="t">B</text>
<line x1="280" y1="426" x2="280" y2="335" class="force"/><text x="295" y="340" class="t">Rz</text>
<text x="65" y="650" class="s">Rz направлена по +Z,</text>
<text x="65" y="680" class="s">если это реакция вверх.</text>
<text x="65" y="735" class="s">Если стрелка вниз, это −Rz.</text>

<!-- 2 view along X -->
<rect x="505" y="110" width="430" height="800" rx="12" class="panel"/>
<text x="530" y="150" class="h">Приращение по X</text>
<text x="530" y="182" class="s">Смотрим вдоль +X: X — точка</text>
<circle cx="715" cy="470" r="13" fill="white" stroke="#17212b" stroke-width="3"/><circle cx="715" cy="470" r="4" class="dot"/>
<text x="745" y="477" class="t">⊙ +X</text>
<line x1="715" y1="470" x2="715" y2="275" class="axis"/><text x="698" y="257" class="t">+Z</text>
<line x1="715" y1="470" x2="575" y2="470" class="axis"/><text x="535" y="478" class="t">−Y</text>
<text x="690" y="520" class="t">A</text>
<!-- Rz vertical and its sign -->
<line x1="715" y1="470" x2="715" y2="355" class="force"/><text x="735" y="365" class="t">Rz</text><text x="735" y="395" class="s">(+Z)</text>
<line x1="715" y1="470" x2="715" y2="585" class="dash"/><text x="735" y="590" class="s">−Z</text>
<path d="M715 340 C790 270 865 300 875 380" class="mom"/><text x="760" y="260" class="s" fill="#176da3">ΔMy от Rz</text>
<text x="545" y="680" class="s">После центрирования:</text>
<text x="545" y="715" class="s">• A — в центре;</text>
<text x="545" y="750" class="s">• X — точка;</text>
<text x="545" y="785" class="s">• через центр видны Y и Z;</text>
<text x="545" y="820" class="s">• Rz сохраняет направление +Z.</text>

<!-- 3 view along Y -->
<rect x="975" y="110" width="490" height="800" rx="12" class="panel"/>
<text x="1000" y="150" class="h">Приращение по Y</text>
<text x="1000" y="182" class="s">Смотрим вдоль +Y: Y — точка</text>
<!-- B central, A hidden behind -->
<circle cx="1215" cy="470" r="15" fill="white" stroke="#17212b" stroke-width="3"/><circle cx="1215" cy="470" r="8" class="point"/>
<text x="1245" y="477" class="t">⊙ +Y</text>
<text x="1190" y="520" class="t">B</text>
<text x="1190" y="550" class="s">A закрыта B</text>
<!-- local x,z through B -->
<line x1="1215" y1="470" x2="1390" y2="470" class="axis"/><text x="1392" y="478" class="t">+X</text>
<line x1="1215" y1="470" x2="1215" y2="275" class="axis"/><text x="1198" y="257" class="t">+Z</text>
<line x1="1215" y1="470" x2="1215" y2="585" class="dash"/><text x="1235" y="590" class="s">−Z</text>
<!-- ZB and Rz directions -->
<line x1="1215" y1="470" x2="1215" y2="330" class="force"/><text x="1235" y="335" class="t">ZB</text><text x="1235" y="365" class="s">(+Z)</text>
<line x1="1215" y1="470" x2="1215" y2="555" class="force"/><text x="1235" y="555" class="t">Rz</text><text x="1235" y="580" class="s">(−Z)</text>
<path d="M1215 300 C1290 235 1380 270 1390 355" class="mom"/><text x="1260" y="235" class="s" fill="#176da3">ΔMy = сила Z × плечо X</text>
<text x="1000" y="670" class="s">Здесь именно тот вид,</text>
<text x="1000" y="705" class="s">о котором ты говорил:</text>
<text x="1000" y="745" class="s">B ставится в центр;</text>
<text x="1000" y="780" class="s">A находится за B и не видна;</text>
<text x="1000" y="815" class="s">через B проведены X и Z.</text>

<text x="40" y="960" class="h">Знак приращения</text>
<text x="300" y="960" class="t">Направление силы по +Z или −Z определяет знак ΔMy; направление по +Y или −Y определяет знак ΔMz.</text>
</svg>
