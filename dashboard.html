<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../">
  <meta name="theme-color" content="#0a0b10"><title>HolyWorld Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
    :root{--bg:#0a0b10;--panel:#11131a;--panel2:#171a22;--line:#292e39;--text:#f5f6f8;--muted:#9299a8;--lime:#d8ff62;--blue:#84b6ff;--orange:#ffb86b;--red:#ff7e92;--font:'DM Sans',sans-serif;--head:Manrope,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 0,#252a1c,transparent 27%),var(--bg);color:var(--text);font-family:var(--font)}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 28px}
    header{height:78px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{font:800 21px var(--head);letter-spacing:-1px;display:flex;align-items:center;gap:10px;white-space:nowrap}.mark{width:27px;height:27px;border-radius:9px 9px 9px 2px;background:var(--lime);position:relative;transform:rotate(-8deg)}.mark:after{content:'';position:absolute;width:8px;height:8px;left:10px;top:9px;border-radius:50%;background:#10130a}.nav{display:flex;gap:6px;align-items:center;overflow:auto}.nav a{color:var(--muted);font-size:13px;padding:10px 12px;border-radius:9px;white-space:nowrap}.nav a:hover,.nav a.active{background:var(--panel2);color:var(--text)}.status{font-size:12px;color:var(--muted);white-space:nowrap}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:7px;box-shadow:0 0 10px var(--lime)}
    main{padding:56px 0 80px}.intro{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:35px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--lime);font-weight:700}.intro h1{font:800 clamp(36px,5vw,62px)/1 var(--head);letter-spacing:-3px;margin:15px 0 14px}.intro p{max-width:560px;color:var(--muted);line-height:1.6;margin:0}.updated{color:var(--muted);font-size:12px;white-space:nowrap;padding-bottom:5px}.updated b{color:var(--text);font-weight:500}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.stat,.card{background:linear-gradient(145deg,rgba(24,27,36,.95),rgba(16,18,25,.95));border:1px solid var(--line);border-radius:14px}.stat{padding:20px;min-height:115px}.stat-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.stat-value{font:800 30px var(--head);margin-top:18px;letter-spacing:-1px}.stat-value.accent{color:var(--lime)}.content{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.card{padding:22px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.card h2{font:700 19px var(--head);letter-spacing:-.7px;margin:0}.card-head span{font-size:12px;color:var(--muted)}.server-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.server{padding:15px;background:var(--panel2);border:1px solid #252a34;border-radius:11px;display:flex;align-items:center;gap:12px}.server:hover{border-color:#59616f}.server-icon{width:37px;height:37px;border-radius:10px;background:#252d20;color:var(--lime);display:grid;place-items:center;font-weight:700}.server-info{min-width:0;flex:1}.server-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.server-id{font-size:11px;color:var(--muted);margin-top:4px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 9px var(--lime)}.event-list{display:flex;flex-direction:column;gap:9px}.event{display:flex;align-items:center;gap:11px;padding:12px;background:var(--panel2);border-radius:10px}.event-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#262331;color:var(--orange);font-size:15px}.event-main{min-width:0;flex:1}.event-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-sub{color:var(--muted);font-size:11px;margin-top:3px}.tag{font-size:10px;color:var(--orange);border:1px solid rgba(255,184,107,.35);border-radius:20px;padding:4px 7px}.empty,.error{color:var(--muted);font-size:13px;padding:24px 4px;text-align:center}.error{color:var(--red)}.table-wrap{overflow:auto}.tr{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px;padding:13px 0;border-bottom:1px solid #242934;font-size:13px}.tr:last-child{border-bottom:0}.tr.head{padding-top:0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.rate{color:var(--lime);font-weight:600}.refresh{border:1px solid var(--line);background:var(--panel2);border-radius:8px;color:var(--muted);padding:7px 10px;font-size:12px;cursor:pointer}.refresh:hover{color:var(--text);border-color:#68717e}.loading{height:80px;display:grid;place-items:center;color:var(--muted);font-size:13px}.loader{width:17px;height:17px;border:2px solid var(--line);border-top-color:var(--lime);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{border-top:1px solid rgba(255,255,255,.08);padding:22px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
    @media(max-width:850px){.nav{order:3;width:100%;justify-content:space-between}.status{display:none}header{height:auto;min-height:78px;flex-wrap:wrap;padding-top:17px;padding-bottom:10px}.stats{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.intro{display:block}.updated{margin-top:20px}.server-list{grid-template-columns:1fr}}
    @media(max-width:520px){.wrap{padding:0 16px}main{padding-top:38px}.intro h1{letter-spacing:-2px}.card{padding:16px}.stat{padding:15px;min-height:100px}.stat-value{font-size:25px;margin-top:13px}.tr{grid-template-columns:1.3fr 1fr .8fr;gap:8px;font-size:12px}footer{display:block;line-height:1.8}}
  </style>
</head>
<body>
  <header class="wrap"><a class="brand" href="servers/"><i class="mark"></i>HolyWorld <span style="color:var(--lime)">Live</span></a><nav class="nav"><a href="servers/" data-route="servers">Серверы</a><a href="events/" data-route="events">События</a><a href="votings/" data-route="votings">Голосования</a><a href="coins/" data-route="coins">Монеты</a><a href="health/" data-route="health">Состояние API</a></nav><span class="status"><i></i>API online</span></header>
  <main class="wrap"><section class="intro"><div><div class="eyebrow">HolyWorld / live data</div><h1 id="title">Серверы HolyWorld</h1><p id="description">Актуальный список серверов и данные игрового проекта в одном месте.</p></div><div class="updated">Обновлено <b id="updated">—</b></div></section><section class="stats" id="stats"></section><section class="content" id="content"></section></main>
  <footer class="wrap"><span>© 2026 HolyWorld Live</span><span>Данные предоставлены публичным REST API HolyWorld</span></footer>
  <script>
    const $=s=>document.querySelector(s), path=location.pathname.split('/').filter(Boolean).pop()||'servers';
    const titles={servers:['Серверы HolyWorld','Онлайн и список всех доступных серверов.'],events:['Активные события','Что прямо сейчас происходит на серверах.'],votings:['Активные голосования','Текущие голосования и кандидаты игроков.'],coins:['Обмен монет','История последних изменений курса монет.'],health:['Состояние API','Проверка доступности сервисов HolyWorld.']};
    const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const formatDate=ms=>{const d=new Date(Number(ms));return Number.isNaN(d.getTime())?'—':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
    function loading(el){el.innerHTML='<div class="loading"><i class="loader"></i></div>'}
    function stat(label,value,accent=''){return `<article class="stat"><div class="stat-label"><span>${label}</span><span>LIVE</span></div><div class="stat-value ${accent}">${value}</div></article>`}
    function setIntro(){const t=titles[titles[path]?path:'servers'];$('#title').textContent=t[0];$('#description').textContent=t[1];document.title=t[0]+' — HolyWorld Live';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===path))}
    async function api(endpoint){
      const local=location.hostname==='localhost'||location.hostname==='127.0.0.1';
      const file=endpoint.split('?')[0];
      const source=local?'/api/holyworld/'+endpoint:'data/'+file+'.json';
      const r=await fetch(source);if(!r.ok)throw Error('API error');return r.json()
    }
    function makeStats(items){$('#stats').innerHTML=items.map(x=>stat(...x)).join('')}
    function serverView(data){const rows=Object.entries(data);makeStats([['Серверов',rows.length,'accent'],['Статус','Online','accent'],['API','REST',''],['Обновление','auto','']]);$('#content').innerHTML=`<article class="card" style="grid-column:1/-1"><div class="card-head"><h2>Все серверы</h2><button class="refresh" onclick="render()">Обновить данные</button></div><div class="server-list">${rows.map(([id,name])=>`<div class="server"><span class="server-icon">HW</span><div class="server-info"><div class="server-name">${esc(name)}</div><div class="server-id">${esc(id)}</div></div><i class="dot"></i></div>`).join('')}</div></article>`}
    function eventView(data){const rows=Object.entries(data).flatMap(([server,events])=>events.map(event=>({...event,server})));makeStats([['Событий',rows.length,'accent'],['Серверов',Object.keys(data).length,''],['Режим','Live','accent'],['Автообновление','5 мин','']]);$('#content').innerHTML=`<article class="card" style="grid-column:1/-1"><div class="card-head"><h2>Активные события</h2><button class="refresh" onclick="render()">Обновить данные</button></div><div class="event-list">${rows.length?rows.map(e=>`<div class="event"><span class="event-icon">✦</span><div class="event-main"><div class="event-title">${esc(e.metadata?.displayName||e.id||'Событие')}</div><div class="event-sub">${esc(e.server)} · ${esc(e.metadata?.rare||'активно')}</div></div><span class="tag">LIVE</span></div>`).join(''):'<div class="empty">Сейчас активных событий нет</div>'}</div></article>`}
    function votingView(data){const rows=Object.entries(data).flatMap(([server,votings])=>votings.map(v=>({...v,server})));makeStats([['Голосований',rows.length,'accent'],['Серверов',Object.keys(data).length,''],['Статус','Активны','accent'],['API','REST','']]);$('#content').innerHTML=`<article class="card" style="grid-column:1/-1"><div class="card-head"><h2>Активные голосования</h2><button class="refresh" onclick="render()">Обновить данные</button></div>${rows.length?`<div class="event-list">${rows.map(v=>`<div class="event"><span class="event-icon" style="color:var(--blue)">✓</span><div class="event-main"><div class="event-title">${esc(v.title||v.name||v.id||'Голосование')}</div><div class="event-sub">${esc(v.server)} · кандидатов: ${Array.isArray(v.candidates)?v.candidates.length:'—'}</div></div><span class="tag" style="color:var(--blue);border-color:rgba(132,182,255,.35)">OPEN</span></div>`).join('')}</div>`:'<div class="empty">Активных голосований нет</div>'}</article>`}
    function coinsView(data){makeStats([['Записей',data.length,'accent'],['Последний курс',data[0]?Number(data[0].rate).toLocaleString('ru-RU'):'—','accent'],['Период','Последние сделки',''],['API','REST','']]);$('#content').innerHTML=`<article class="card" style="grid-column:1/-1"><div class="card-head"><h2>История обменов</h2><button class="refresh" onclick="render()">Обновить данные</button></div><div class="table-wrap"><div class="tr head"><span>Сделка</span><span>Курс монет</span><span>Время</span></div>${data.length?data.map((x,i)=>`<div class="tr"><span>Обмен #${data.length-i}</span><span class="rate">${Number(x.rate).toLocaleString('ru-RU')}</span><span>${formatDate(x.datetime)}</span></div>`).join(''):'<div class="empty">История пока пуста</div>'}</div></article>`}
    function healthView(data){const ok=data.status==='ok'||data.status==='healthy'||data.status;makeStats([['Сервис',ok?'Online':'Offline',ok?'accent':''],['Ответ','200','accent'],['Проверка','/v1/health',''],['Режим','Public API','']]);$('#content').innerHTML=`<article class="card" style="grid-column:1/-1"><div class="card-head"><h2>Проверка соединения</h2><button class="refresh" onclick="render()">Проверить снова</button></div><div class="event"><span class="event-icon" style="color:var(--lime)">✓</span><div class="event-main"><div class="event-title">HolyWorld REST API отвечает</div><div class="event-sub">Статус сервиса: ${esc(data.status||'online')}</div></div><span class="tag" style="color:var(--lime);border-color:rgba(216,255,98,.35)">ONLINE</span></div></article>`}
    async function render(){setIntro();loading($('#stats'));loading($('#content'));try{const data=await api(path==='coins'?'coins-trades?limit=20':path);if(path==='servers')serverView(data);else if(path==='events')eventView(data);else if(path==='votings')votingView(data);else if(path==='coins')coinsView(data);else healthView(data);$('#updated').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){$('#stats').innerHTML='';$('#content').innerHTML='<article class="card" style="grid-column:1/-1"><div class="error">Не удалось загрузить данные API. Попробуйте обновить страницу.</div></article>'}}
    render();
  </script>
</body>
</html>
