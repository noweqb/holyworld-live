<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#17212b"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
    <style>
      .axis { stroke:#17212b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .force { stroke:#c0392b; stroke-width:3; fill:none; marker-end:url(#redArrow); }
      .moment { stroke:#2471a3; stroke-width:3; fill:none; marker-end:url(#blueArrow); }
      .dim { stroke:#555; stroke-width:2; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
      .guide { stroke:#999; stroke-width:1.5; stroke-dasharray:7 6; }
      text { font-family:Arial, sans-serif; fill:#17212b; }
      .title { font-size:26px; font-weight:bold; }
      .label { font-size:22px; }
      .small { font-size:18px; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="white"/>

  <!-- Panel 1 -->
  <text x="55" y="48" class="title">Момент относительно оси Y</text>
  <text x="55" y="78" class="small">Перенос оси вдоль X: учитываются вертикальные составляющие</text>

  <!-- x line and points -->
  <line x1="115" y1="280" x2="1080" y2="280" class="axis"/>
  <text x="1087" y="288" class="label">X</text>
  <circle cx="145" cy="280" r="6" fill="#17212b"/>
  <circle cx="350" cy="280" r="6" fill="#17212b"/>
  <circle cx="650" cy="280" r="6" fill="#17212b"/>
  <circle cx="960" cy="280" r="6" fill="#17212b"/>
  <text x="130" y="315" class="label">A</text>
  <text x="338" y="315" class="label">T</text>
  <text x="640" y="315" class="label">G</text>
  <text x="950" y="315" class="label">B</text>

  <!-- z axis -->
  <line x1="145" y1="280" x2="145" y2="120" class="axis"/>
  <text x="130" y="110" class="label">Z</text>

  <!-- vertical forces -->
  <line x1="350" y1="280" x2="350" y2="165" class="force"/>
  <text x="365" y="180" class="label">Tz = T sin β</text>
  <line x1="650" y1="280" x2="650" y2="395" class="force"/>
  <text x="665" y="390" class="label">G</text>
  <line x1="805" y1="280" x2="805" y2="395" class="force"/>
  <text x="820" y="390" class="label">Rc</text>
  <line x1="960" y1="280" x2="960" y2="145" class="force"/>
  <text x="975" y="155" class="label">ZB</text>

  <!-- dimensions -->
  <line x1="145" y1="450" x2="350" y2="450" class="dim"/>
  <text x="240" y="440" class="label">a</text>
  <line x1="350" y1="450" x2="650" y2="450" class="dim"/>
  <text x="490" y="440" class="label">b</text>
  <line x1="650" y1="450" x2="960" y2="450" class="dim"/>
  <text x="800" y="440" class="label">c</text>
  <line x1="145" y1="465" x2="960" y2="465" class="dim"/>
  <text x="520" y="495" class="label">a + b + c</text>

  <!-- accumulated dMy -->
  <path d="M350 220 C390 120, 540 115, 610 215" class="moment"/>
  <text x="450" y="125" class="label" fill="#2471a3">dMy = −Tz · dx</text>
  <path d="M650 350 C700 475, 850 475, 925 350" class="moment"/>
  <text x="720" y="535" class="label" fill="#2471a3">dMy = −Fz · dx</text>

  <!-- Panel 2 -->
  <text x="55" y="590" class="title">Момент относительно оси Z</text>
  <text x="55" y="620" class="small">Перенос оси вдоль X: учитываются горизонтальные составляющие по Y</text>
  <line x1="115" y1="720" x2="1080" y2="720" class="axis"/>
  <text x="1087" y="728" class="label">X</text>
  <circle cx="145" cy="720" r="6" fill="#17212b"/>
  <circle cx="350" cy="720" r="6" fill="#17212b"/>
  <circle cx="650" cy="720" r="6" fill="#17212b"/>
  <circle cx="960" cy="720" r="6" fill="#17212b"/>
  <text x="130" y="755" class="label">A</text>
  <text x="338" y="755" class="label">T</text>
  <text x="640" y="755" class="label">F</text>
  <text x="950" y="755" class="label">B</text>

  <!-- y direction arrows -->
  <line x1="350" y1="720" x2="350" y2="655" class="force"/>
  <text x="365" y="660" class="label">Ty = T cos β</text>
  <line x1="650" y1="720" x2="650" y2="655" class="force"/>
  <text x="665" y="660" class="label">F</text>
  <line x1="960" y1="720" x2="960" y2="635" class="force"/>
  <text x="975" y="640" class="label">YB</text>

  <path d="M350 685 C405 625, 535 625, 610 685" class="moment"/>
  <text x="430" y="625" class="label" fill="#2471a3">dMz = Ty · dx</text>
  <path d="M650 685 C705 625, 850 625, 925 685" class="moment"/>
  <text x="735" y="610" class="label" fill="#2471a3">dMz = Fy · dx</text>
</svg>
