<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25313b"/></marker>
 <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bd3328"/></marker>
 <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176da3"/></marker>
 <style>
  text{font-family:Arial,sans-serif;fill:#202a32}.h{font-size:29px;font-weight:bold}.s{font-size:20px}.t{font-size:24px;font-weight:bold}
  .ax{stroke:#25313b;stroke-width:3;fill:none;marker-end:url(#a)}.f{stroke:#bd3328;stroke-width:4;fill:none;marker-end:url(#red)}
  .inc{stroke:#176da3;stroke-width:4;fill:none;marker-end:url(#blue)}.guide{stroke:#89939a;stroke-width:2;stroke-dasharray:7 6;fill:none}
  .beam{stroke:#555f66;stroke-width:9}.dim{stroke:#555;stroke-width:2;fill:none;marker-start:url(#a);marker-end:url(#a)}
  .box{fill:#f8fafb;stroke:#b8c2c9;stroke-width:2}.red{fill:#bd3328}.blue{fill:#176da3}
 </style>
</defs>
<rect width="1500" height="1050" fill="white"/>
<text x="45" y="45" class="h">Метод приращений для схемы на фотографии</text>
<text x="45" y="78" class="s">Ось переносим от A вдоль X. На каждом участке добавляется dr × F.</text>

<!-- My section -->
<rect x="35" y="105" width="1430" height="410" rx="12" class="box"/>
<text x="60" y="145" class="h">1. Приращения момента Mᵧ</text>
<text x="60" y="178" class="s">Берём только составляющие сил по Z: T″, G, R_C, Z_B.</text>

<!-- baseline perspective -->
<line x1="130" y1="330" x2="1310" y2="260" class="beam"/>
<line x1="130" y1="330" x2="290" y2="330" class="ax"/><text x="300" y="337" class="s">+X</text>
<line x1="130" y1="330" x2="75" y2="275" class="ax"/><text x="48" y="268" class="s">+Y</text>
<line x1="130" y1="330" x2="130" y2="220" class="ax"/><text x="115" y="208" class="s">+Z</text>
<text x="112" y="370" class="t">A</text>
<circle cx="130" cy="330" r="6"/>
<circle cx="350" cy="317" r="6"/><circle cx="700" cy="296" r="6"/><circle cx="940" cy="282" r="6"/><circle cx="1310" cy="260" r="6"/>
<text x="335" y="360" class="t">T</text><text x="685" y="340" class="t">G</text><text x="925" y="325" class="t">C</text><text x="1295" y="300" class="t">B</text>

<!-- vertical z forces -->
<line x1="350" y1="317" x2="350" y2="225" class="f"/><text x="365" y="230" class="t red">T″</text>
<line x1="700" y1="296" x2="700" y2="390" class="f"/><text x="715" y="390" class="t red">G</text>
<line x1="940" y1="282" x2="940" y2="370" class="f"/><text x="955" y="370" class="t red">R_C</text>
<line x1="1310" y1="260" x2="1310" y2="175" class="f"/><text x="1325" y="180" class="t red">Z_B</text>

<!-- incremental arcs My -->
<path d="M350 280 C405 205 560 190 660 270" class="inc"/><text x="430" y="205" class="s blue">ΔMᵧ = −T″·a</text>
<path d="M700 360 C755 445 865 445 925 360" class="inc"/><text x="755" y="475" class="s blue">ΔMᵧ = −G·b</text>
<path d="M940 350 C1010 435 1170 435 1260 345" class="inc"/><text x="1035" y="475" class="s blue">ΔMᵧ = −R_C·(…)</text>
<text x="1010" y="215" class="s blue">последнее приращение: Z_B·(…)</text>

<!-- dims -->
<line x1="130" y1="425" x2="350" y2="412" class="dim"/><text x="235" y="410" class="s">a</text>
<line x1="350" y1="425" x2="700" y2="404" class="dim"/><text x="515" y="400" class="s">b</text>
<line x1="700" y1="425" x2="1310" y2="388" class="dim"/><text x="990" y="385" class="s">до B</text>
<text x="60" y="490" class="s">Итог: Mᵧ(A) = сумма всех приращений по пути A → T → G → C → B.</text>

<!-- Mz section -->
<rect x="35" y="545" width="1430" height="470" rx="12" class="box"/>
<text x="60" y="585" class="h">2. Приращения момента M𝓏</text>
<text x="60" y="618" class="s">Берём только составляющие сил по Y: T′, F, Y_B.</text>

<line x1="130" y1="780" x2="1310" y2="710" class="beam"/>
<line x1="130" y1="780" x2="290" y2="780" class="ax"/><text x="300" y="787" class="s">+X</text>
<line x1="130" y1="780" x2="75" y2="725" class="ax"/><text x="48" y="718" class="s">+Y</text>
<line x1="130" y1="780" x2="130" y2="670" class="ax"/><text x="115" y="658" class="s">+Z</text>
<text x="112" y="820" class="t">A</text><circle cx="130" cy="780" r="6"/>
<circle cx="350" cy="767" r="6"/><circle cx="700" cy="746" r="6"/><circle cx="1310" cy="710" r="6"/>
<text x="335" y="810" class="t">T</text><text x="685" y="790" class="t">F</text><text x="1295" y="750" class="t">B</text>

<!-- y forces -->
<line x1="350" y1="767" x2="245" y2="705" class="f"/><text x="190" y="695" class="t red">T′</text>
<line x1="700" y1="746" x2="590" y2="680" class="f"/><text x="545" y="670" class="t red">F</text>
<line x1="1310" y1="710" x2="1200" y2="645" class="f"/><text x="1140" y="635" class="t red">Y_B</text>

<!-- incremental Mz arcs -->
<path d="M350 735 C420 655 570 650 660 725" class="inc"/><text x="445" y="650" class="s blue">ΔM𝓏 = +T′·a</text>
<path d="M700 715 C770 635 940 635 1030 710" class="inc"/><text x="805" y="630" class="s blue">ΔM𝓏 = +F·(…)</text>
<path d="M1050 760 C1110 835 1230 835 1290 760" class="inc"/><text x="1080" y="880" class="s blue">ΔM𝓏 = +Y_B·(…)</text>

<line x1="130" y1="910" x2="350" y2="897" class="dim"/><text x="235" y="895" class="s">a</text>
<line x1="350" y1="910" x2="700" y2="889" class="dim"/><text x="515" y="885" class="s">до F</text>
<line x1="700" y1="910" x2="1310" y2="873" class="dim"/><text x="990" y="870" class="s">до B</text>
<text x="60" y="975" class="s">Итог: M𝓏(A) = сумма приращений от T′, F и Y_B.</text>
</svg>
